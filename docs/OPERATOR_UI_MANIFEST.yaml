schema: plotter_operator_ui_manifest
schema_version: 2
status: implemented_windowed_operator_ui
source_of_truth: SwiftUI implementation under macos/PlotterVision/Sources/PlotterVision
purpose: >
  Text-reviewable manifest for the Plotter operator UI. Reviewers can mark
  visible controls for keep, removal, rename, move, or deletion of related code
  without relying on ambiguous prose.

review_semantics:
  decision_values:
    keep: Leave the visible UI item in its current role.
    remove: Remove the visible UI item only, unless cleanup says otherwise.
    rename: Keep the item but change its operator-facing label.
    move: Keep the item but move it to move_to.
    merge: Combine this item into merge_with.
    split: Split this item into separate controls or surfaces.
    promote_to_window: Make this a separate SwiftUI Window.
    question: Needs explicit human review before implementation.

  cleanup_values:
    preserve_shared_code: Remove or move UI references only. Keep shared state, bridge routes, planners, models, tests, and helpers.
    ui_only: Delete only the visible SwiftUI item and direct view wiring.
    delete_related_code: >
      Delete the visible item and code exclusively serving that item. This includes
      private SwiftUI helper views, local state, local bindings, menu sections, and
      tests whose only purpose was that item. Do not delete shared bridge routes,
      safety gates, drawing planners, calibration artifacts, or model fields unless
      they are proven exclusive and separately named in related_code_candidates.
    backend_review_required: >
      Do not delete implementation code automatically. First review Python bridge,
      planner, calibration, persisted artifact, route usage, and non-UI tests.

  required_evidence_for_delete_related_code:
    - rg usage scan for each related_code_candidate.
    - confirmation that no active route, persisted artifact, or non-UI test depends on the code.
    - Swift app build after deletion.
    - focused operator UI and bridge observability tests after deletion.

state_model:
  owner: OperatorWorkspaceState
  source_files:
    - macos/PlotterVision/Sources/PlotterVision/OperatorWorkspaceState.swift
    - macos/PlotterVision/Sources/PlotterVision/OperatorWindowSupport.swift
  role: >
    Shared app-wide operator state for camera models, camera visibility, window
    diagnostics, setup snapshots, portrait captures, and cross-window command
    requests.
  camera_visibility_defaults:
    plotter_camera_visible: false
    face_camera_visible: false
  camera_workspace_rule:
    both_visible: split plane
    plotter_only: plotter camera pane
    face_only: face camera pane
    neither_visible: empty black workspace
  diagnostics_payload:
    bridge_model_field: operatorUIState
    codex_snapshot_path: state_summary.ui
    includes:
      - workspace.plotter_camera_visible
      - workspace.face_camera_visible
      - workspace.split_plane
      - workspace.empty
      - windows.machine_controls
      - windows.setup_panel
      - windows.plotter_video_panel
      - windows.face_video_panel
      - cameras.plotter.visible
      - cameras.face.visible

layout_model:
  primary_workspace:
    owner: ContentView
    placement: main_window
    role: Camera/video workspace and projected drawing evidence.
    source_files:
      - macos/PlotterVision/Sources/PlotterVision/ContentView.swift
      - macos/PlotterVision/Sources/PlotterVision/CameraOverlaySupportViews.swift
      - macos/PlotterVision/Sources/PlotterVision/MeasurementOverlay.swift
    decision: keep
    cleanup: preserve_shared_code

  top_bar:
    owner: ContentView.topBar
    placement: top_overlay
    role: App-level status and window/camera launch controls.
    source_files:
      - macos/PlotterVision/Sources/PlotterVision/ContentView.swift
    decision: keep
    cleanup: preserve_shared_code
    controls:
      - id: app_brand
        label: Plotter Vision
        type: static_label
        action: none
        decision: keep
        cleanup: ui_only
      - id: machine_bridge
        label: connection
        type: status_button
        action: refresh or reconnect bridge state
        decision: keep
        cleanup: preserve_shared_code
      - id: machine_control_window
        label: Machine
        type: window_toggle_button
        window_id: machine-controls
        action: open or close machine controls window
        decision: keep
        cleanup: preserve_shared_code
      - id: plotter_camera_dropdown
        label: plotter camera
        type: camera_device_dropdown
        model: plotterCamera
        action: choose plotter camera device
        decision: keep
        cleanup: preserve_shared_code
      - id: plotter_camera_toggle
        label: Plotter
        type: toggle_button
        initial_state: false
        action: show or hide plotter camera pane and start or stop that camera stream
        decision: keep
        cleanup: preserve_shared_code
      - id: plotter_video_panel
        label: Plot Vid
        type: window_toggle_button
        window_id: plotter-video-panel
        action: open or close plotter video controls
        decision: keep
        cleanup: preserve_shared_code
      - id: face_camera_dropdown
        label: face camera
        type: camera_device_dropdown
        model: faceCamera
        action: choose face camera device
        decision: keep
        cleanup: preserve_shared_code
      - id: face_camera_toggle
        label: Face
        type: toggle_button
        initial_state: false
        action: show or hide face camera pane and start or stop that camera stream
        decision: keep
        cleanup: preserve_shared_code
      - id: face_video_panel
        label: Face Vid
        type: window_toggle_button
        window_id: face-video-panel
        action: open or close face video and portrait controls
        decision: keep
        cleanup: preserve_shared_code
      - id: setup_window
        label: Setup
        type: window_toggle_button
        window_id: setup-panel
        action: open or close setup window
        decision: keep
        cleanup: preserve_shared_code

windows:
  machine_control_window:
    owner: MachineControlPanel
    window_id: machine-controls
    source_files:
      - macos/PlotterVision/Sources/PlotterVision/MachineControlPanel.swift
      - macos/PlotterVision/Sources/PlotterVision/AppMain.swift
    role: Machine status, stop, pen, jog, arming, and bridge/controller action surface.
    decision: keep
    cleanup: preserve_shared_code

  setup_window:
    owner: SetupPanel
    window_id: setup-panel
    source_files:
      - macos/PlotterVision/Sources/PlotterVision/SetupPanel.swift
      - macos/PlotterVision/Sources/PlotterVision/CalibrationWizardView.swift
      - macos/PlotterVision/Sources/PlotterVision/ContentView.swift
      - macos/PlotterVision/Sources/PlotterVision/AppMain.swift
      - plotter_vision/calibration/readiness.py
      - plotter_vision/calibration/binding.py
      - plotter_vision/bridge/server.py
    role: Visual field setup, cap confirmation, motion calibration, drawing calibration, and post-checkout drawing status.
    authority_boundary: Swift displays and collects observations. Python persists registration, probe evidence, binding solves, and trust state.
    decision: keep
    cleanup: preserve_shared_code
    post_checkout_section:
      id: drawing_checkout
      status: placeholder_only
      note: Drawing examples were removed until the next real drawing surface is defined.

  plotter_video_panel:
    owner: PlotterVideoPanel
    window_id: plotter-video-panel
    source_files:
      - macos/PlotterVision/Sources/PlotterVision/PlotterVideoPanel.swift
      - macos/PlotterVision/Sources/PlotterVision/ContentViewViewportIntent.swift
    role: Plotter camera display controls.
    decision: keep
    cleanup: preserve_shared_code
    controls:
      - { id: calibrated_grid, label: Calibrated Grid, type: toggle, decision: keep, cleanup: preserve_shared_code }
      - { id: measurements, label: Measurements, type: toggle, decision: keep, cleanup: preserve_shared_code }
      - { id: segmentation, label: Segmentation, type: toggle, decision: keep, cleanup: preserve_shared_code }
      - { id: motion_detection, label: Motion Detection, type: toggle, decision: keep, cleanup: preserve_shared_code }
      - { id: overlay_alpha, label: Overlay Alpha, type: slider, decision: keep, cleanup: preserve_shared_code }
      - { id: video_filter, label: Filter, type: picker, decision: keep, cleanup: preserve_shared_code }
      - { id: rotate_plotter_video, label: Rotate 90, type: button, decision: keep, cleanup: preserve_shared_code }
      - { id: original_video, label: Original Video, type: button, decision: keep, cleanup: preserve_shared_code }
      - { id: fit_field, label: Fit Field, type: button, shortcut: command-f, decision: keep, cleanup: preserve_shared_code }
      - { id: sample_cap_color, label: Sample Cap Color, type: button, decision: keep, cleanup: preserve_shared_code }
      - { id: reset_cap_color, label: Reset Cap Color, type: button, decision: keep, cleanup: preserve_shared_code }
      - { id: reset_visual_controls, label: Reset Visual Controls, type: button, decision: keep, cleanup: preserve_shared_code }

  face_video_panel:
    owner: FaceVideoPanel
    window_id: face-video-panel
    source_files:
      - macos/PlotterVision/Sources/PlotterVision/FaceVideoPanel.swift
      - macos/PlotterVision/Sources/PlotterVision/PortraitPanel.swift
      - macos/PlotterVision/Sources/PlotterVision/ContentView.swift
      - macos/PlotterVision/Sources/PlotterVision/Models.swift
      - macos/PlotterVision/Sources/PlotterVision/PlotterBridgeModel.swift
      - plotter_vision/drawing/raster.py
      - plotter_vision/bridge/server.py
    role: Face camera contour monitor, portrait rendering parameters, capture strip, and portrait drawing creation.
    decision: keep
    cleanup: preserve_shared_code
    controls:
      - { id: face_contours, label: Face Contours, type: toggle, decision: keep, cleanup: preserve_shared_code }
      - { id: image_panel, label: Image Panel, type: toggle, decision: keep, cleanup: preserve_shared_code }
      - { id: create_portrait_drawing, label: Create <Technique> Drawing, type: button, decision: keep, cleanup: preserve_shared_code }
      - { id: live_monitor, label: Live Monitor, type: toggle, decision: keep, cleanup: preserve_shared_code }
      - { id: portrait_mode, label: Mode, type: segmented_picker, options: [Lines, Hatch, XHatch, Facets, Dots], decision: keep, cleanup: preserve_shared_code }
      - { id: contour_levels, label: Levels, type: stepper, decision: keep, cleanup: preserve_shared_code }
      - { id: smoothing, label: Smooth, type: stepper, decision: keep, cleanup: preserve_shared_code }
      - { id: low_quantile, label: Low, type: slider, decision: rename, suggested_label: Shadow Floor, cleanup: preserve_shared_code }
      - { id: high_quantile, label: High, type: slider, decision: rename, suggested_label: Highlight Ceiling, cleanup: preserve_shared_code }
      - { id: min_length, label: Min Len, type: slider, decision: rename, suggested_label: Minimum Stroke, cleanup: preserve_shared_code }
      - { id: illumination, label: Light, type: slider, decision: rename, suggested_label: Light Normalize, cleanup: preserve_shared_code }
      - { id: captures_strip, label: Captures, type: thumbnail_strip, decision: keep, cleanup: preserve_shared_code }

deleted_surfaces:
  camera_layout_selector:
    former_symbols:
      - CameraLayoutControl
      - CameraLayoutMode
      - ContentView.cameraLayout
    decision: remove
    cleanup: delete_related_code
    replacement: plotter_camera_toggle plus face_camera_toggle determine camera workspace layout.
  start_cameras_button:
    former_symbols:
      - ContentView.startVisibleCameras
    decision: remove
    cleanup: delete_related_code
    replacement: individual camera toggles start and stop their own camera streams.
  top_bar_visuals_menu:
    former_symbols:
      - VisualControlsMenu
      - ToolbarControls
    decision: remove
    cleanup: delete_related_code
    replacement: plotter_video_panel and face_video_panel.
  top_bar_draw_verify_examples:
    former_symbols:
      - DrawVerifyMenu
      - DrawVerifyCoordinator
      - PlotterBridgeModel.previewDrawVerifyCapability
      - PlotterBridgeModel.runVerifiedDrawVerifyCapability
      - PlotterBridgeModel.previewShapeOverlay
      - PlotterBridgeModel.drawTriangle
      - PlotterBridgeModel.drawFaceRaster
      - BridgeShapeExecutionRequest
      - BridgeFaceRasterDrawRequest
    decision: remove
    cleanup: delete_related_code
    replacement: defer drawing examples until the next real drawing surface is defined.
    preserved_shared_code:
      - Python capability-test routes and tests.
      - Python shape route and planner tests.
      - Python optional face-raster draw route and tests.
      - Swift drawing status fields used by visual binding bounds-frame drawing.

validation:
  required:
    - YAML parses.
    - Swift app builds.
    - tests/test_operator_wizard_contract.py passes.
    - tests/test_bridge_codex_observability.py passes.
    - tests/test_bridge_observability.py passes.
    - make check passes before landing.
