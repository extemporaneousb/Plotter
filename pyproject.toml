[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotter-vision"
version = "0.1.0"
description = "Mac-local control and calibration foundation for a BlackBox X32 pen plotter"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyserial>=3.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
plotterctl = "plotter_vision.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["plotter_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
